<!doctype html>
<meta charset="utf-8">
<title>Vulkano · escenas abstractas</title>
<!-- Generador de las imágenes de las cards de marcas (scripts/render-media.cjs).
     Todo es dibujo de línea en blanco y negro: sin neblinas, sin humo, sin grano.
     El vídeo de los héroes sale de scripts/flow.html. -->
<canvas id="c"></canvas>
<script>
const TAU = Math.PI * 2;
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function noise1(seed) {
  const r = rng(seed), v = Array.from({ length: 256 }, r);
  return (x) => { const i = Math.floor(x), f = x - i, a = v[i & 255], b = v[(i + 1) & 255], u = f * f * (3 - 2 * f); return a + (b - a) * u; };
}
const n1 = noise1(7), n2 = noise1(19), n3 = noise1(31);


const SCENES = {
  // Curvas de nivel de un volcán que respiran
  contours(ctx, w, h, t, c) {
    const cx = w * .5, cy = h * .56, R = Math.max(w, h) * .62;
    for (let k = 1; k <= 26; k++) {
      const base = (k / 26) * R;
      ctx.beginPath();
      for (let a = 0; a <= 220; a++) {
        const th = a / 220 * TAU;
        const d = base * (1 + .11 * (n1(Math.cos(th) * 1.4 + k * .35 + t * .25) + n3(Math.sin(th) * 1.4 + k * .3 - t * .2) - 1) + .07 * Math.sin(th * 3 + t * .4 + k * .2));
        const x = cx + Math.cos(th) * d * 1.25, y = cy + Math.sin(th) * d * .72;
        a ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.closePath();
      ctx.strokeStyle = c.line(.14 + .5 * (1 - k / 26)); ctx.lineWidth = c.lw; ctx.stroke();
    }
  },
  // Anillos de cráter que se expanden
  rings(ctx, w, h, t, c) {
    const cx = w * .5, cy = h * .5, R = Math.hypot(w, h) * .55, n = 34;
    for (let k = 0; k < n; k++) {
      const p = ((k / n) + t * .045) % 1, r = Math.pow(p, 1.35) * R;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU);
      ctx.strokeStyle = c.line(.6 * Math.sin(Math.PI * p)); ctx.lineWidth = c.lw; ctx.stroke();
    }
  },
  // Constelación: puntos que derivan unidos por líneas finas
  constellation(ctx, w, h, t, c) {
    const r = rng(5), pts = [];
    for (let i = 0; i < 90; i++) {
      const bx = r() * w, by = r() * h, sp = .2 + r() * .4, ph = r() * TAU;
      pts.push([bx + Math.cos(t * sp + ph) * 40, by + Math.sin(t * sp * .8 + ph) * 30]);
    }
    const lim = Math.min(w, h) * .2;
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const d = Math.hypot(pts[i][0] - pts[j][0], pts[i][1] - pts[j][1]);
      if (d < lim) { ctx.beginPath(); ctx.moveTo(pts[i][0], pts[i][1]); ctx.lineTo(pts[j][0], pts[j][1]); ctx.strokeStyle = c.line(.45 * (1 - d / lim)); ctx.lineWidth = c.lw; ctx.stroke(); }
    }
    pts.forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, c.lw * 1.6, 0, TAU); ctx.fillStyle = c.line(.7); ctx.fill(); });
  },
  // Estratos: líneas paralelas que ondulan como capas de roca
  strata(ctx, w, h, t, c) {
    const n = 42;
    for (let k = 0; k < n; k++) {
      const y0 = (k + .5) / n * h;
      ctx.beginPath();
      for (let x = 0; x <= w; x += w / 160) {
        const u = x / w;
        const y = y0 + Math.sin(u * 5 + t * .5 + k * .18) * h * .025 + (n2(u * 3 + k * .12 + t * .15) - .5) * h * .07;
        x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.strokeStyle = c.line(.18 + .3 * Math.sin(Math.PI * k / n)); ctx.lineWidth = c.lw; ctx.stroke();
    }
  },
  // Retícula de puntos atravesada por una onda
  dots(ctx, w, h, t, c) {
    const step = Math.min(w, h) / 22;
    for (let y = step / 2; y < h; y += step) for (let x = step / 2; x < w; x += step) {
      const d = Math.hypot(x - w * .5, y - h * .55) / Math.min(w, h);
      const s = .5 + .5 * Math.sin(d * 12 - t * 1.2);
      ctx.beginPath(); ctx.arc(x, y, c.lw * (.6 + s * 2.2), 0, TAU); ctx.fillStyle = c.line(.15 + s * .5); ctx.fill();
    }
  },
  // Columnas de basalto: teselado hexagonal de línea
  basalt(ctx, w, h, t, c) {
    const s = Math.min(w, h) / 9, r = rng(3);
    for (let row = -1; row < h / (s * .866) + 1; row++) for (let col = -1; col < w / s + 1; col++) {
      const cx = col * s + (row % 2) * s / 2, cy = row * s * .866, k = .98 + r() * .04;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) { const a = TAU / 6 * i + Math.PI / 6; ctx.lineTo(cx + Math.cos(a) * s * .577 * k, cy + Math.sin(a) * s * .577 * k); }
      ctx.closePath(); ctx.strokeStyle = c.line(.25 + r() * .35); ctx.lineWidth = c.lw; ctx.stroke();
    }
  },
  // Rastros de estrellas: arcos concéntricos
  trails(ctx, w, h, t, c) {
    const r = rng(11), cx = w * .5, cy = h * .3;
    for (let i = 0; i < 260; i++) {
      const rad = Math.sqrt(r()) * Math.hypot(w, h) * .8, a0 = r() * TAU + t * .05, span = .25 + r() * .4;
      ctx.beginPath(); ctx.arc(cx, cy, rad, a0, a0 + span); ctx.strokeStyle = c.line(.12 + Math.pow(r(), 3) * .6); ctx.lineWidth = c.lw; ctx.stroke();
    }
  }
};

function colors(mode, lw) {
  return mode === "dark"
    ? { bg: "#1c1c1e", line: (a) => `rgba(255,255,255,${a})`, lw }
    : { bg: "#fffcfc", line: (a) => `rgba(48,48,48,${a})`, lw };
}

// Un fotograma de cualquier escena (cards de marcas).
window.still = function (name, w, h, t, mode) {
  const cv = document.getElementById("c"); cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d"), c = colors(mode || "dark", Math.max(1, w / 900));
  ctx.fillStyle = c.bg; ctx.fillRect(0, 0, w, h);
  SCENES[name](ctx, w, h, t, c);
  return cv.toDataURL("image/jpeg", .88);
};

</script>
