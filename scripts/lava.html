<!doctype html>
<meta charset="utf-8">
<title>Vulkano · lava</title>
<!-- Vídeo del héroe: formas de lava abstractas, en grises muy claros sobre papel.
     Cinco "imágenes" (escenas) que se funden lentamente y enlazan en bucle.
     Lo renderiza scripts/render-media.cjs fotograma a fotograma. -->
<canvas id="c" width="1600" height="900"></canvas>
<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform vec2 uRes;
uniform float uTime;      // tiempo local de la escena (s)
uniform float uSeed;      // desplaza el campo de ruido
uniform float uScale;     // tamaño de las formas
uniform float uWarp;      // intensidad del flujo
uniform float uAngle;     // dirección del flujo
uniform float uLines;     // densidad de las líneas de flujo
uniform float uDepth;     // contraste de la escena
out vec4 outColor;

vec2 hash(vec2 p) {
  p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
  return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
}
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  return mix(mix(dot(hash(i), f), dot(hash(i + vec2(1, 0)), f - vec2(1, 0)), u.x),
             mix(dot(hash(i + vec2(0, 1)), f - vec2(0, 1)), dot(hash(i + vec2(1, 1)), f - vec2(1, 1)), u.x), u.y);
}
// Ruido fractal con pocas octavas: formas grandes y suaves, sin textura menuda.
float fbm(vec2 p, int oct) {
  float a = 0.5, s = 0.0;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 5; i++) { if (i >= oct) break; s += a * noise(p); p = m * p; a *= 0.5; }
  return s;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  float c = cos(uAngle), s = sin(uAngle);
  vec2 p = mat2(c, -s, s, c) * uv * uScale + uSeed;
  float t = uTime * 0.06;

  // Flujo de lava: dominio deformado en dos niveles, todo con formas amplias.
  vec2 q = vec2(fbm(p + vec2(0.0, t), 3), fbm(p + vec2(5.2, 1.3) - t, 3));
  vec2 r = vec2(fbm(p + uWarp * q + vec2(1.7, 9.2) + 0.7 * t, 3), fbm(p + uWarp * q + vec2(8.3, 2.8) - 0.5 * t, 3));
  float f = fbm(p + uWarp * r, 3);
  float v = clamp(0.5 + 1.1 * f, 0.0, 1.0);

  // Relieve muy suave: luz rasante sobre la colada.
  vec3 n = normalize(vec3(-dFdx(v) * uRes.y * 0.35, -dFdy(v) * uRes.y * 0.35, 1.0));
  float light = dot(n, normalize(vec3(-0.45, 0.6, 0.66)));

  vec3 paper = vec3(1.0, 0.988, 0.988);
  vec3 stone = vec3(0.84, 0.835, 0.85);
  float tone = smoothstep(0.35, 0.85, v);
  vec3 col = mix(paper, stone, tone * uDepth);
  col += (light - 0.86) * 0.12 * uDepth;

  // Pocas líneas de flujo, finísimas: las crestas de la colada.
  float l = abs(fract(v * uLines) - 0.5);
  float w = fwidth(v * uLines) * 0.9;
  float line = 1.0 - smoothstep(0.0, w, l);
  col = mix(col, vec3(0.45, 0.44, 0.47), line * 0.16 * uDepth);

  outColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
</script>
<script>
const cv = document.getElementById("c");
const gl = cv.getContext("webgl2", { preserveDrawingBuffer: true, antialias: true });
const vs = `#version 300 es
in vec2 a; void main() { gl_Position = vec4(a, 0.0, 1.0); }`;
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, document.getElementById("fs").textContent));
gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, "a"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = (n) => gl.getUniformLocation(prog, n);

// Cinco imágenes: cada una con su escala, flujo, dirección y densidad de líneas.
const SCENES = [
  { seed: 1.3,  scale: 0.75, warp: 2.6, angle: 0.25, lines: 6, depth: 1.0 },
  { seed: 7.9,  scale: 1.0,  warp: 2.2, angle: -0.6, lines: 8, depth: 0.9 },
  { seed: 13.1, scale: 0.6,  warp: 3.0, angle: 1.2,  lines: 5, depth: 1.0 },
  { seed: 21.4, scale: 0.9,  warp: 2.8, angle: 2.4,  lines: 7, depth: 0.95 },
  { seed: 33.7, scale: 0.7,  warp: 2.4, angle: -1.8, lines: 6, depth: 1.0 }
];
const SCENE_LEN = 5, FADE = 1.6;
window.videoDuration = SCENES.length * SCENE_LEN;

const tmp = document.createElement("canvas"), tctx = tmp.getContext("2d");
function draw(scene, t) {
  gl.uniform2f(U("uRes"), cv.width, cv.height);
  gl.uniform1f(U("uTime"), t); gl.uniform1f(U("uSeed"), scene.seed);
  gl.uniform1f(U("uScale"), scene.scale); gl.uniform1f(U("uWarp"), scene.warp);
  gl.uniform1f(U("uAngle"), scene.angle); gl.uniform1f(U("uLines"), scene.lines);
  gl.uniform1f(U("uDepth"), scene.depth);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
// Fotograma en el instante `time` (s): fundido entre escenas consecutivas.
window.lavaFrame = function (time, w, h) {
  if (cv.width !== w) { cv.width = w; cv.height = h; tmp.width = w; tmp.height = h; gl.viewport(0, 0, w, h); }
  if (tmp.width !== w) { tmp.width = w; tmp.height = h; }
  const idx = Math.floor(time / SCENE_LEN) % SCENES.length, local = time - idx * SCENE_LEN;
  draw(SCENES[idx], local);
  tctx.globalAlpha = 1; tctx.drawImage(cv, 0, 0);
  const fade = local > SCENE_LEN - FADE ? (local - (SCENE_LEN - FADE)) / FADE : 0;
  if (fade > 0) {
    const e = fade * fade * (3 - 2 * fade);
    draw(SCENES[(idx + 1) % SCENES.length], local - SCENE_LEN);
    tctx.globalAlpha = e; tctx.drawImage(cv, 0, 0); tctx.globalAlpha = 1;
  }
  return tmp.toDataURL("image/jpeg", 0.92);
};
</script>
