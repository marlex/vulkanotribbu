<link rel="icon" href="assets/img/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<script>
  (function (d) {
    d.classList.add("js");
    try {
      if (sessionStorage.getItem("vt-nav") === "1" && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
        d.classList.add("is-arriving");
      }
      sessionStorage.removeItem("vt-nav");
    } catch (e) {}
    setTimeout(function () {
      // Red de seguridad: si el script principal no llegó a cargar, nada se queda oculto.
      if (window.__vtReady) return;
      var r = document.querySelectorAll(".reveal");
      for (var i = 0; i < r.length; i++) r[i].classList.add("is-in");
      d.classList.remove("is-arriving");
    }, 4500);
  })(document.documentElement);
</script>
